<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TechTitan Solutions provides CATS past papers and notes for examination preparation for university of eldoret students.">
    <meta name="keywords" content="CATS, past papers, notes, exam preparation, TechTitan Solutions , University of Eldoret, UoE">
    <meta name="author" content="TechTitan Solutions">
    <title>techtitan solutions ,university of eldoret,uoe</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome used for the password visibility toggle eye icon -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <div class="login-container">
        
        <!-- Left Side: Image and Banner Text -->
        <div class="left-banner">
            <div class="overlay"></div>
            <div class="banner-text">
                <h1>welcome to techtitan solutions</h1>
                <p>WE PROVIDE CATS PAST PAPERS AND NOTES FOR YOUR EXAMINATION PREPARATION</p>
            </div>
        </div>

        <!-- Right Side: Login Form Box -->
        <div class="right-form-section">
            <div class="login-box">
                <!-- Logo -->
                <div class="logo-container">
                    <img src="libo.jpg" alt="TechTitan Solutions Logo" class="logo">
                </div>

                <h2>Hi, welcome back</h2>
                <p class="subtitle">Please fill in your details to log in</p>

                <!-- Form -->
                <form>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your Email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Enter your Password" required>
                            <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-signin">Sign In</button>
                </form>

                <p class="signup-text">Don't have an account? <a href="#">Sign Up</a></p>
                
    
            </div>
        </div>

    </div>

    <!-- Script to make the show/hide password toggle function -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
